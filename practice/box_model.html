<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Box Model Practice</title>
        <script src="../validate.js"></script>
        <style>
            #redbox{
            background-color:red;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            margin-left: 300px;
            }

            #bluebox{
            background-color:blue;
            height:100px;
            width:100px;
            border:2px black solid;
            padding: 100px;
            background-clip:content-box;
            margin-left: 400px;
            }
            #greenbox{
            background-color:green;
            height:100px;
            width:100px;
            border:2px black solid;
            padding-left:30px;
            background-clip:content-box;
            margin-top:30px;
            margin-bottom:30px;
            }
            #yellowbox{
            background-color:yellow;
            height:100px;
            width:100px;
            border:2px black solid;
            padding:40px 20px 0px 20px;
            background-clip:content-box;
            margin-left: 350px;
            }
            #purplebox{
            background-color:purple;
            height:100px;
            width:100px;
            border:2px black solid;
            padding-bottom: 100px;
            background-clip:content-box;
            margin-left: 250px;
            }
        </style>
    </head>
    <body>
        <h1>These are some boxes</h1>
        <div id= "redbox"> </div>
        <div id= "bluebox"> </div>
        <div id= "greenbox"> </div>
        <div id= "yellowbox"> </div>
        <div id= "purplebox"> </div>

    </body>
</html>
